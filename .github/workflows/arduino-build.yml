name: Digital Feed Arduino Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      # Изтегляне на проекта от GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Инсталиране на Arduino CLI
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Обновяване на индекса с наличните Arduino платформи
      - name: Update Arduino indexes
        run: arduino-cli core update-index

      # Инсталиране на AVR платформата за Arduino Mega 2560
      - name: Install AVR platform
        run: arduino-cli core install arduino:avr

      # Инсталиране на LiquidCrystal като стандартна Arduino библиотека.
      # Не копираме локалния LiquidCrystal.cpp, за да няма дублирани дефиниции.
      - name: Install LiquidCrystal library
        run: arduino-cli lib install LiquidCrystal

      # Подготовка на отделна скица за TSS версията.
      # Старата версия има същите ISR прекъсвания и не трябва да се компилира заедно с TSS.
      - name: Prepare TSS sketch
        run: |
          mkdir -p build/Digital_Feed_Z-X_7e2_TSS
          for file in *.ino; do
            if [ "$file" = "Digital_Feed_7e2.ino" ]; then
              continue
            fi
            cp "$file" build/Digital_Feed_Z-X_7e2_TSS/
          done
          # LiquidCrystal се инсталира отделно; не копираме локалните .cpp/.h файлове.

      # Компилиране на TSS версията за Arduino Mega 2560.
      - name: Compile Digital Feed TSS for Arduino Mega 2560
        run: arduino-cli compile --fqbn arduino:avr:mega --warnings all --export-binaries build/Digital_Feed_Z-X_7e2_TSS

      # Проверка къде Arduino CLI е записал HEX файла и събиране в една папка за артефакта.
      - name: Collect HEX file
        run: |
          mkdir -p artifacts
          find build -type f -name '*.hex' -print -exec cp '{}' artifacts/ \;
          echo "HEX files collected:"
          ls -la artifacts
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.hex' -print -quit)"

      # Запазване на HEX файла за изтегляне от GitHub Actions.
      - name: Upload HEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digital_Feed_7e2-HEX
          path: artifacts/*.hex
          if-no-files-found: error
          retention-days: 30
